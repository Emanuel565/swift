<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: ui-sans-serif, system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 14px;
        background: linear-gradient(165deg, #0b0f14 0%, #12181f 100%);
        color: #e4e4e7;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #fafafa;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.35);
      }
      /* ── Status bar ─────────────────────────────────────── */
      #statusBar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 10px;
        border: 1px solid transparent;
        transition: background 0.25s, border-color 0.25s;
      }
      #statusBar.idle {
        background: rgba(39, 39, 42, 0.6);
        border-color: #3f3f46;
        color: #a1a1aa;
      }
      #statusBar.recording {
        background: rgba(220, 38, 38, 0.12);
        border-color: rgba(220, 38, 38, 0.45);
        color: #fca5a5;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      #statusBar.idle .dot { background: #52525b; }
      #statusBar.recording .dot {
        background: #ef4444;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      /* ── Form elements ──────────────────────────────────── */
      label {
        display: block;
        margin-top: 10px;
        font-size: 11px;
        color: #a1a1aa;
      }
      input[type='text'],
      input[type='password'],
      input[type='number'] {
        width: 100%;
        margin-top: 4px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid #27272a;
        background: #09090b;
        color: #fafafa;
        font-size: 12px;
      }
      input:focus {
        outline: none;
        border-color: rgba(16, 185, 129, 0.5);
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
      }
      input:disabled { opacity: 0.45; }
      .alert {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 11px;
        line-height: 1.45;
        border: 1px solid rgba(245, 158, 11, 0.35);
        background: rgba(120, 53, 15, 0.25);
        color: #fcd34d;
      }
      .alert strong { color: #fef3c7; }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        font-size: 12px;
        color: #d4d4d8;
      }
      .row input[type='checkbox'] {
        width: 16px;
        height: 16px;
        accent-color: #10b981;
      }
      /* ── Buttons ────────────────────────────────────────── */
      button {
        margin-top: 12px;
        width: 100%;
        padding: 10px 12px;
        cursor: pointer;
        border: none;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        transition: background 0.15s, transform 0.1s, opacity 0.2s;
      }
      button:active { transform: scale(0.98); }
      button:disabled {
        opacity: 0.38;
        cursor: not-allowed;
        pointer-events: none;
      }
      #start {
        background: linear-gradient(135deg, #059669, #10b981);
        color: white;
      }
      #start:hover:not(:disabled) { filter: brightness(1.06); }
      #stop {
        background: rgba(220, 38, 38, 0.18);
        color: #fca5a5;
        border: 1px solid rgba(220, 38, 38, 0.4);
      }
      #stop:hover:not(:disabled) { background: rgba(220, 38, 38, 0.28); }
      /* ── Log ─────────────────────────────────────────────── */
      #log {
        font-size: 11px;
        color: #a1a1aa;
        max-height: 130px;
        overflow: auto;
        margin-top: 12px;
        padding: 10px;
        border-radius: 12px;
        background: #09090b;
        border: 1px solid #27272a;
        white-space: pre-wrap;
        line-height: 1.4;
      }
      .err { color: #fca5a5; }
      .ok  { color: #6ee7b7; }
      .dim { color: #52525b; font-style: italic; }
    </style>
  </head>
  <body>
    <h3>
      <span>Ghost Audio</span>
      <span class="badge">v3</span>
    </h3>

    <div id="statusBar" class="idle">
      <span class="dot"></span>
      <span id="statusText">Aguardando</span>
    </div>

    <div id="audioMeter" style="display:none; margin-bottom:10px;">
      <div style="font-size:10px; color:#a1a1aa; margin-bottom:4px; display:flex; justify-content:space-between;">
        <span>Nivel de audio da aba</span>
        <span id="meterHint"></span>
      </div>
      <div style="background:#09090b; border:1px solid #27272a; border-radius:6px; height:12px; overflow:hidden;">
        <div id="meterBar" style="height:100%; width:0%; background:linear-gradient(90deg, #10b981 0%, #eab308 60%, #ef4444 90%); transition:width 0.1s linear;"></div>
      </div>
    </div>

    <div class="alert">
      <strong>Meet-only:</strong> funciona somente em <strong>meet.google.com</strong>.
      Ative as legendas do Meet para melhorar a transcrição ao vivo.
    </div>

    <label>WebSocket URL
      <input type="text" id="wsUrl" placeholder="ws://127.0.0.1:3000/ws/audio" />
    </label>
    <div class="row">
      <input type="checkbox" id="devMode" checked />
      <span>Modo teste (sem JWT)</span>
    </div>
    <label>JWT (só se desmarcar o modo teste)
      <input type="password" id="token" placeholder="Token de /auth/login" disabled />
    </label>
    <label>Intervalo de chunk (ms)
      <input type="number" id="timeslice" value="500" min="100" max="4000" />
    </label>
    <div class="row">
      <input type="checkbox" id="includeMic" checked />
      <span>Incluir meu microfone (recomendado — pega sua fala também)</span>
    </div>
    <div class="row">
      <input type="checkbox" id="consent" />
      <span>Autorizo a captura do áudio da reunião no Google Meet</span>
    </div>

    <button type="button" id="start">Iniciar gravação</button>
    <button type="button" id="stop" disabled>Parar gravação</button>

    <div id="log"></div>
    <script src="popup.js"></script>
  </body>
</html>
